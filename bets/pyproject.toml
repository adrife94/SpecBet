[project]
name = "specbet"
version = "0.1.0"
description = "Calculadora de decisiones de apuestas deportivas 1X2 (comparador de cuotas, surebets, freebets y bonos), con CLI en Python y app Flutter, construida con Spec-Driven Development (SDD)."
